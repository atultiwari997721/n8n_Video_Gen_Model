databases:
  # The PostgreSQL Database to store user API keys and session tokens securely
  - name: saas-database
    databaseName: saasdb
    user: saasuser
    plan: free

services:
  # The FastAPI Web Service using the Dockerfile
  - type: web
    name: saas-dashboard
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      # Inject the database connection URL automatically into the web service
      - key: DATABASE_URL
        fromDatabase:
          name: saas-database
          property: connectionString
